```html
<!DOCTYPE html>
<!-- Tells the browser that this document is written in HTML5. -->

<html lang="en">
<!-- Starts the HTML document and specifies that the language is English. -->

<head>
  <!-- Starts the head section, which contains information about the webpage. -->

  <meta charset="UTF-8">
  <!-- Sets the character encoding so text and symbols display correctly. -->

  <title>My First Web Page</title>
  <!-- Sets the title that appears in the browser tab. -->

</head>
<!-- Closes the head section. -->

<body>
  <!-- Starts the body section, which contains the visible content of the webpage. -->

  <h1>My First Web Page</h1>
  <!-- Creates the main heading of the webpage. -->

  <p>Name: Harshdeepsingh Majethiya</p>
  <!-- Creates a paragraph displaying the student's name. -->

  <p>Course Name: Intro to Website Development</p>
  <!-- Creates a paragraph displaying the course name. -->

  <p>Course Number: IS 117</p>
  <!-- Creates a paragraph displaying the course number. -->

  <p>Course Section: 003</p>
  <!-- Creates a paragraph displaying the course section. -->

  <footer>
    <!-- Starts the footer section at the bottom of the webpage. -->

    <p>&copy; Harshdeepsingh Majethiya - Due Date: October 7, 2026</p>
    <!-- Displays the copyright symbol, student's name, and assignment due date. -->

  </footer>
  <!-- Closes the footer section. -->

</body>
<!-- Closes the body section. -->

</html>
<!-- Closes the HTML document. -->
```
